# SonarQube project identity
sonar.projectKey=auto-cv-processing
sonar.projectName=VCS Interview Assistant
sonar.sourceEncoding=UTF-8

# This repository is a monorepo. Keep the analysis scope limited to application
# and shared TypeScript/JavaScript source instead of scanning documentation or assets.
sonar.sources=apps,packages

# Use the repository's existing TypeScript projects so path aliases and compiler
# settings are resolved consistently across the backend, frontend, extension, and shared package.
sonar.typescript.tsconfigPaths=apps/backend/tsconfig.json,apps/frontend/tsconfig.json,apps/extension/tsconfig.json,packages/shared/tsconfig.json

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/docs/**,**/storage/**,**/uploads/**,**/public/**,**/*.d.ts,**/*.map,**/*.log,**/*.env*

# Coverage is intentionally not configured until a real LCOV report exists.
# SonarQube imports JS/TS coverage using this property:
# sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info
